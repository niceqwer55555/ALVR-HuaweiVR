<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="360" fill="#f8fafc"/>

  <!-- 高配 PC -->
  <rect x="30" y="120" width="220" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">高配 PC</text>
  <text x="140" y="175" text-anchor="middle" font-size="13" fill="#475569">ALVR Dashboard</text>
  <text x="140" y="195" text-anchor="middle" font-size="13" fill="#475569">SteamVR + 游戏</text>
  <text x="140" y="215" text-anchor="middle" font-size="13" fill="#475569">NVENC/AMF 编码</text>
  <text x="140" y="238" text-anchor="middle" font-size="11" fill="#94a3b8">server / streamer（发流）</text>

  <!-- 低配 PC -->
  <rect x="360" y="90" width="260" height="190" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="490" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#5b21b6">低配 PC（本工程）</text>
  <rect x="378" y="132" width="224" height="40" rx="8" fill="#ede9fe"/>
  <text x="490" y="157" text-anchor="middle" font-size="13" fill="#5b21b6">网络协议 client.rs（收流/回传）</text>
  <rect x="378" y="178" width="224" height="40" rx="8" fill="#ede9fe"/>
  <text x="490" y="203" text-anchor="middle" font-size="13" fill="#5b21b6">FFmpeg 解码 → BGRA 帧</text>
  <rect x="378" y="224" width="224" height="40" rx="8" fill="#ede9fe"/>
  <text x="490" y="249" text-anchor="middle" font-size="13" fill="#5b21b6">回环 → SBS 渲染器（D3D11）</text>

  <!-- 眼镜 -->
  <rect x="710" y="120" width="160" height="130" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="790" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#15803d">VR Glass</text>
  <text x="790" y="175" text-anchor="middle" font-size="13" fill="#475569">3200×1600 屏</text>
  <text x="790" y="195" text-anchor="middle" font-size="13" fill="#475569">SBS 左右眼</text>
  <text x="790" y="215" text-anchor="middle" font-size="13" fill="#475569">IMU 头动</text>

  <!-- 箭头：视频流 -->
  <line x1="250" y1="165" x2="355" y2="165" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="302" y="155" text-anchor="middle" font-size="11" fill="#2563eb">H.264 流</text>
  <text x="302" y="182" text-anchor="middle" font-size="10" fill="#94a3b8">9943/9944</text>

  <!-- 箭头：tracking 回传 -->
  <line x1="355" y1="255" x2="250" y2="255" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowg)"/>
  <text x="302" y="248" text-anchor="middle" font-size="11" fill="#16a34a">tracking</text>

  <!-- 箭头：低配PC -> 眼镜 -->
  <line x1="620" y1="165" x2="705" y2="165" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="662" y="155" text-anchor="middle" font-size="11" fill="#7c3aed">USB-C DP</text>

  <!-- 箭头：IMU 回低配PC -->
  <line x1="705" y1="215" x2="620" y2="215" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowg)"/>
  <text x="662" y="235" text-anchor="middle" font-size="10" fill="#16a34a">IMU(HID)</text>

  <!-- 底部说明 -->
  <text x="450" y="320" text-anchor="middle" font-size="13" fill="#64748b">眼镜插低配 PC = 本地显示器（非网络设备） · 高配 PC 只负责渲染与编码 · 头姿经 IMU 回传 server</text>
  <text x="450" y="342" text-anchor="middle" font-size="11" fill="#94a3b8">本工程 = 低配 PC 上的瘦客户端：收流 → 解码 → SBS 输出 → IMU 回传</text>
</svg>
