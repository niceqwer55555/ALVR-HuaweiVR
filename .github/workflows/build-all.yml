name: Build server and clients

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  windows-server:
    name: Windows 服务端（MinGW 交叉编译）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MinGW posix / libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            pkg-config libclang-dev unzip zip

      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: x86_64-pc-windows-gnu

      - name: 准备 FFmpeg 8.1 win64 + DirectXMath
        run: |
          DEPS="服务端-ALVR-完整源码/deps/windows"
          mkdir -p "$DEPS"
          curl -fL --retry 3 -o /tmp/ffmpeg.zip \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip
          unzip -q /tmp/ffmpeg.zip -d /tmp/ffmpeg
          FF_DIR="$(find /tmp/ffmpeg -maxdepth 1 -type d -name 'ffmpeg-n8.1*' | head -n 1)"
          rm -rf "$DEPS/ffmpeg" && mv "$FF_DIR" "$DEPS/ffmpeg"

          git clone --depth 1 https://github.com/microsoft/DirectXMath.git /tmp/DirectXMath
          rm -rf "$DEPS/directxmath" && mkdir -p "$DEPS/directxmath"
          cp /tmp/DirectXMath/Inc/*.h /tmp/DirectXMath/Inc/*.inl "$DEPS/directxmath/"
          # Linux 大小写敏感，源码里是小写 include
          cp "$DEPS/directxmath/DirectXColors.h" "$DEPS/directxmath/directxcolors.h"
          cp "$DEPS/directxmath/DirectXMath.h" "$DEPS/directxmath/directxmath.h"
          # MSVC 的 openvr_api.lib 需以 lib*.a 形式供 GNU ld 检索
          cp "服务端-ALVR-完整源码/openvr/lib/win64/openvr_api.lib" \
             "服务端-ALVR-完整源码/openvr/lib/win64/libopenvr_api.a"

      - name: 交叉编译 Windows 服务端
        working-directory: 服务端-ALVR-完整源码
        run: |
          export CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc-posix
          export CXX_x86_64_pc_windows_gnu=x86_64-w64-mingw32-g++-posix
          export AR_x86_64_pc_windows_gnu=x86_64-w64-mingw32-ar
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$CC_x86_64_pc_windows_gnu
          LIBCLANG="$(find /usr/lib /usr/local/lib -name 'libclang.so*' -print -quit 2>/dev/null || true)"
          if [ -n "$LIBCLANG" ]; then export LIBCLANG_PATH="$(dirname "$LIBCLANG")"; else export LIBCLANG_PATH=/lib/x86_64-linux-gnu; fi

          cargo build --release -p alvr_dashboard -p alvr_launcher -p alvr_server_core \
            --target x86_64-pc-windows-gnu
          cargo build --release -p alvr_server_openvr --features gpl \
            --target x86_64-pc-windows-gnu

      - name: 打包 openvr 目录
        run: |
          FFMPEG_BIN="$PWD/服务端-ALVR-完整源码/deps/windows/ffmpeg/bin" \
            bash scripts/package-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ALVR-HuaweiVR-Windows
          path: |
            dist/ALVR-HuaweiVR-Windows.zip
            dist/ALVR-HuaweiVR-Windows.zip.sha256

  android-generic:
    name: 安卓客户端③（通用高通，arm64）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: true

      - name: 安装 Android SDK / NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: aarch64-linux-android

      - name: 编译完整 ALVR arm64 原生客户端
        run: bash "客户端3-安卓接收端(高通/去华为框架)/scripts/build_full_native.sh"

      - name: 打包完整通用 APK
        run: bash "客户端3-安卓接收端(高通/去华为框架)/scripts/build_apk.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: GenericALVR-arm64
          path: 客户端3-安卓接收端(高通/去华为框架)/build/GenericALVR-arm64.apk

  android-huawei:
    name: 安卓客户端②（华为框架，armv7）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: true

      - name: 安装 Android SDK / NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - name: 编译 ARMv7 + ARM64 原生库
        run: bash "客户端2-安卓接收端(依赖华为框架)/client_openxr/scripts/build_native.sh"

      - name: 打包华为框架 APK
        run: bash "客户端2-安卓接收端(依赖华为框架)/client_openxr/scripts/build_linux.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: HuaweiVRGlass-armv7
          path: 客户端2-安卓接收端(依赖华为框架)/client_openxr/build/HuaweiVRGlass-armv7.apk

  release:
    name: 发布到 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-server, android-generic, android-huawei]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ALVR-HuaweiVR-Windows.zip
            artifacts/ALVR-HuaweiVR-Windows.zip.sha256
            artifacts/GenericALVR-arm64.apk
            artifacts/HuaweiVRGlass-armv7.apk
